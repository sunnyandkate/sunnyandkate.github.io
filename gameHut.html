<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SunnyandKate/TheGameArcade</title>
    <link rel="icon" href="images/favicon2.ico">
    <link rel="stylesheet" href="css/cookieconsent.css">
    <script src="js/cookieconsent.js"></script>
    <link rel="stylesheet" href="css/styles.css?v=1.2.6" type="text/css">
</head>
<body>

    <div class="container">   
        <canvas id="arcadeCanvas" width="320" height="180"></canvas>
        <div id="ui-layer">  
            <div class="box-container">
                <div class="middle-top">
                    <div class="gameConfirmModal">  
                        <div class="box about-content">                   
                            <p>This Game is built with WebGL. Do you want to play it and get redirected?</p>
                            <button class="playGame">Yes</button>
                            <button class="dontplayGame">No</button>                      
                        </div>
                    </div>
                    <div class="box mobileGamesConsoleContainer" style="display: none;">
                        <button class="closeConsoleBtn">X</button> 
                        <div class="mobileGameConsoleTop">
                            <p class="description">Select an app to download directly to your mobile device.</p>                            
                            <h3 class="topTitle"></h3>                        
                        </div>
                        <div class="mobileGamesConsoleBottom">
                            <div class=" mobileGamesList"></div>
                            <div class="download-section">
                                <div class="meta-format">FORMAT---</div>
                                <div class="meta-size">SIZE---</div>
                                <button class="mobile-game-download">DOWNLOAD</button>
                            </div>                        
                        </div>                           
                    </div>
                </div>
                <div class="middle-bottom">
                    <!--dialog box-->
                    <div class="box dialogBox" style="display: none;">  
                        <button class="closeDialogBtn">X</button>          
                        <p class="dialogContent">dialog</p>
                        <div class="dialogButtons" style="display: none;">
                            <button class="goInside">Yes</button>
                            <button class="stayOutside">No</button>
                        </div>                           
                    </div>
                    <!--arcade info box-->
                    <div class="box arcadeInfoBox" style="display: none;">  
                        <button class="closeArcadeInfoBtn">X</button>          
                        <p class="arcadeInfoContent">dialog</p>
                        <button class="nextBtn" style="display: none;"></button> 
                        <div class="arcadeButtons" style="display: none;">
                            <button class="arcade-link">itch.io</button> 
                            <button class="arcade-stay">Stay</button> 
                        </div>                            
                    </div>
                </div>
                <div class="right-top">
                    <!--mobile controls-->
                    <div class="mobile-controls-container arcade-controls">
                        <div id="mobile-controls" class="touch-buttons">
                            <button class="upBtn">up</button>
                            <button class="rightBtn">right</button>
                            <button class="downBtn">down</button>
                            <button class="leftBtn">left</button>
                        </div>
                    </div>
                </div>
                <div class="right-bottom">
                    <footer>
                        <div class="footer-container">
                            <p class="copyright">&copy; 2026 sunnyandkate</p>
                            <a href="mailto:sunnyandkate@icloud.com"><img src="images/letter.png"></a>
                            <a href="legal.html">legal details <span>| </span></a>
                            <a href="privacypolicy.html">privacy policy</a>                            
                        </div>           
                    </footer>
                </div>                   
            </div>     
        </div>
    </div>
    <div id="fade-box" class="fade-screen"></div>
        <script src="js/variables.js"></script>
        <script src="js/gamearcadeVariables.js"></script>
        <script src="js/resizeHandler.js"></script>
        <script src="js/keyInput.js"></script>
        <script src="js/touchInput.js"></script>
        <script src="js/playermovement.js"></script>  
        <script src="js/dialoges.js"></script>
        <script src="js/gamearcadeDialoges.js"></script>    
        <script src="js/gamearcade.js"></script>
        <script src="js/collision.js"></script>
        <script src="js/gamearcadeCollision.js"></script>
   
        <script defer src="js/cookieconsent-init.js"></script>
    </body>
</html>
